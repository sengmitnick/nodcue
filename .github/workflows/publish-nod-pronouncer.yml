name: Publish Nod Pronouncer Image

on:
  push:
    branches: [main]
    paths:
      - server/**
      - package.json
      - package-lock.json
      - Dockerfile
      - .dockerignore
      - compose.production.yml
      - .github/workflows/publish-nod-pronouncer.yml
  workflow_dispatch:
    inputs:
      version:
        description: Optional additional image tag
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: qinglion-registry.cn-hangzhou.cr.aliyuncs.com
  IMAGE: qinglion-registry.cn-hangzhou.cr.aliyuncs.com/sengclaw/nod

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nod-pronouncer-amd64
          cache-to: type=gha,mode=max,scope=nod-pronouncer-amd64
